name: financas_app
description: "ControlFin - Planilha financeira pessoal com categorias visuais."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  fl_chart: ^0.69.0
  intl: 0.20.3
  file_picker: ^13.3.3
  syncfusion_flutter_pdf: ^35.1.43
  csv: ^8.0.0
  image: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícone do app. Para regenerar depois de mudar a logo:
#   flutter test test/tool/render_app_icon_test.dart --dart-define=RENDER_ICON=true
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

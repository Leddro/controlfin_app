# Robô diário dos dados de mercado (tool/update_market.dart).
# Grava na coleção "market" do Firestore; o app só lê de lá.
# Chaves nos Secrets do repositório: ALPHA_VANTAGE_KEY, BRAPI_TOKEN e
# FIREBASE_SERVICE_ACCOUNT (JSON da conta de serviço do Firebase).
name: Dados de mercado

on:
  schedule:
    # Completa: 21h30 UTC = 18h30 em Brasília, depois do fechamento da B3.
    - cron: '30 21 * * *'
    # Rápida (só cotações, Ibovespa e preço das ações): 11h, 13h, 15h e 17h
    # em Brasília, de segunda a sexta. O GitHub pode atrasar alguns minutos.
    - cron: '0 14,16,18,20 * * 1-5'
  # Botão "Run workflow" na aba Actions, para rodar na hora.
  workflow_dispatch:
    inputs:
      modo:
        description: 'Completa (tudo) ou rápida (só cotações)'
        type: choice
        options: [completa, rapida]
        default: completa

# O robô só lê o repositório; quem grava é a conta de serviço do Firebase.
permissions:
  contents: read

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Coletar e gravar
        # Rápida nos horários do pregão ou quando escolhida no botão.
        run: >-
          dart run tool/update_market.dart
          ${{ (github.event.schedule == '0 14,16,18,20 * * 1-5' || inputs.modo == 'rapida') && '--quick' || '' }}
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
